name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/check_privacy.py
      - run: python3 scripts/check_privacy.py --history
      - run: bash scripts/check-secrets.sh tree
      - run: bash scripts/check-secrets.sh history
      - run: python3 scripts/verify_scanner.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: journal/package-lock.json
      - run: python -m pip install ruff==0.14.1
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -s research -p 'test_*.py' -v
      - run: python -m unittest discover -s journal -p 'test_*.py' -v
      - run: bash -n quietlight.sh
      - run: docker compose config --quiet
      - run: npm ci --ignore-scripts
        working-directory: journal
      - run: npm run format:check && npm run build && npm audit --audit-level=high
        working-directory: journal
      - run: npm run test:ui
        working-directory: journal
      - run: docker build -t quietlight-journal:test journal
