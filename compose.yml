name: ${COMPOSE_PROJECT_NAME:-quietlight}

services:
  hermes:
    # Official linux/amd64 image resolved on 2026-10-18. Update deliberately.
    image: nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05
    restart: unless-stopped
    command: [python, /opt/research-kit/journal-worker.py]
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_HOME: /opt/data
      HERMES_TIMEZONE: Europe/London
      TZ: Europe/London
      HERMES_DASHBOARD: "0"
    volumes:
      - ./data:/opt/data
      - ./research:/opt/research-kit:ro
    # Keep the official init/privilege-drop entrypoint. No host socket,
    # project root, existing Codex credentials, or published ports.
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  journal:
    build: ./journal
    restart: unless-stopped
    environment:
      JOURNAL_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,${JOURNAL_BIND:-127.0.0.1},${JOURNAL_ALLOWED_HOSTS:-}"
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    ports:
      - "${JOURNAL_BIND:-127.0.0.1}:${JOURNAL_PORT:-8097}:8097"
    volumes:
      - ./data/research:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
