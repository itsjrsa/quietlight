<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1290" viewBox="0 0 1300 1290"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#66745c"/></marker></defs><rect width="1300" height="1290" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="57" font-size="32" fill="#31362f"><tspan x="40" dy="0">QuietLight / current architecture</tspan></text><text x="40" y="94" font-size="19" fill="#626b5d"><tspan x="40" dy="0">A self-hosted research journal around Hermes — not a Hermes fork.</tspan></text><rect x="30" y="230" width="350" height="340" rx="12" fill="#f3f5ef" stroke="#a5ada0" stroke-dasharray="7 5"/><rect x="860" y="230" width="410" height="590" rx="12" fill="#f3f5ef" stroke="#a5ada0" stroke-dasharray="7 5"/><text x="50" y="261" font-size="14" fill="#31362f"><tspan x="50" dy="0">CONTAINER 1 · JOURNAL</tspan></text><text x="880" y="261" font-size="14" fill="#31362f"><tspan x="880" dy="0">CONTAINER 2 · HERMES</tspan></text><rect x="50" y="120" width="310" height="90" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="70" y="157" font-size="21" fill="#31362f"><tspan x="70" dy="0">Phone / desktop</tspan></text><text x="70" y="188" font-size="16" fill="#626b5d"><tspan x="70" dy="0">Private LAN or Tailscale access</tspan></text><rect x="50" y="300" width="310" height="230" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="70" y="337" font-size="21" fill="#31362f"><tspan x="70" dy="0">QuietLight web application</tspan></text><text x="70" y="368" font-size="16" fill="#626b5d"><tspan x="70" dy="0">Python HTTP API · port 8097</tspan><tspan x="70" dy="21.6">Vanilla JS + CSS interface</tspan><tspan x="70" dy="21.6">Markdown + Mermaid + sanitizing</tspan><tspan x="70" dy="21.6"></tspan><tspan x="70" dy="21.6">Read: daily index and editions</tspan><tspan x="70" dy="21.6">Edit: prompt, schedule, run now</tspan><tspan x="70" dy="21.6">Private key → 24-hour session</tspan></text><rect x="455" y="300" width="310" height="220" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="475" y="337" font-size="21" fill="#31362f"><tspan x="475" dy="0">Shared research state</tspan></text><text x="475" y="368" font-size="16" fill="#626b5d"><tspan x="475" dy="0">profile.json — research brief</tspan><tspan x="475" dy="21.6">schedule.json — daily timing</tspan><tspan x="475" dy="21.6">request.json — one pending run</tspan><tspan x="475" dy="21.6">worker.json — status heartbeat</tspan><tspan x="475" dy="21.6">admin-token — settings key</tspan><tspan x="475" dy="21.6"></tspan><tspan x="475" dy="21.6">Files, not an HTTP/RPC broker</tspan></text><rect x="885" y="300" width="360" height="185" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="905" y="337" font-size="21" fill="#31362f"><tspan x="905" dy="0">Publishing controller · ours</tspan></text><text x="905" y="368" font-size="16" fill="#626b5d"><tspan x="905" dy="0">journal-worker.py</tspan><tspan x="905" dy="21.6">Starts gateway; polls shared files</tspan><tspan x="905" dy="21.6">Uses Hermes CLI to edit/run cron</tspan><tspan x="905" dy="21.6">Publishes status heartbeat</tspan><tspan x="905" dy="21.6">Lives inside Hermes container</tspan></text><rect x="885" y="565" width="360" height="205" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="905" y="602" font-size="21" fill="#31362f"><tspan x="905" dy="0">Hermes runtime · upstream</tspan></text><text x="905" y="633" font-size="16" fill="#626b5d"><tspan x="905" dy="0">Pinned official container image</tspan><tspan x="905" dy="21.6">Gateway + cron scheduler</tspan><tspan x="905" dy="21.6">Agent + provider authentication</tspan><tspan x="905" dy="21.6">Web / terminal / file tools</tspan><tspan x="905" dy="21.6"></tspan><tspan x="905" dy="21.6">Daily schedule or manual run</tspan><tspan x="905" dy="21.6">No changes to Hermes source</tspan></text><rect x="455" y="590" width="310" height="180" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="475" y="627" font-size="21" fill="#31362f"><tspan x="475" dy="0">Research kit · ours</tspan></text><text x="475" y="658" font-size="16" fill="#626b5d"><tspan x="475" dy="0">briefing.txt — editorial rules</tspan><tspan x="475" dy="21.6">ledger.py — history + archive</tspan><tspan x="475" dy="21.6"></tspan><tspan x="475" dy="21.6">Agent reads profile + past coverage</tspan><tspan x="475" dy="21.6">Researches, cites, writes Markdown</tspan><tspan x="475" dy="21.6">Archives through ledger CLI</tspan></text><rect x="455" y="855" width="310" height="150" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="475" y="892" font-size="21" fill="#31362f"><tspan x="475" dy="0">Published archive</tspan></text><text x="475" y="923" font-size="16" fill="#626b5d"><tspan x="475" dy="0">coverage.sqlite3 — authoritative</tspan><tspan x="475" dy="21.6">reports/*.md — exported copies</tspan><tspan x="475" dy="21.6"></tspan><tspan x="475" dy="21.6">Latest revision per London day</tspan><tspan x="475" dy="21.6">Previous revisions retained</tspan></text><rect x="885" y="865" width="360" height="140" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="905" y="902" font-size="21" fill="#31362f"><tspan x="905" dy="0">External dependencies</tspan></text><text x="905" y="933" font-size="16" fill="#626b5d"><tspan x="905" dy="0">Hosted model provider</tspan><tspan x="905" dy="21.6">Search / extraction services</tspan><tspan x="905" dy="21.6">Primary research sources</tspan><tspan x="905" dy="21.6">No local Ollama deployment</tspan></text><rect x="50" y="640" width="310" height="150" rx="12" fill="#ffffff" stroke="#a5ada0" /><text x="70" y="677" font-size="21" fill="#31362f"><tspan x="70" dy="0">Hermes-only state</tspan></text><text x="70" y="708" font-size="16" fill="#626b5d"><tspan x="70" dy="0">Provider credentials / auth</tspan><tspan x="70" dy="21.6">Sessions, cron state and history</tspan><tspan x="70" dy="21.6"></tspan><tspan x="70" dy="21.6">Not mounted into journal container</tspan></text><rect x="50" y="1060" width="1195" height="95" rx="12" fill="#f9f9f7" stroke="#a5ada0" stroke-dasharray="7 5"/><text x="70" y="1095" font-size="20" fill="#31362f"><tspan x="70" dy="0">NOT IMPLEMENTED · notification adapter</tspan></text><text x="70" y="1126" font-size="16" fill="#31362f"><tspan x="70" dy="0">Later: notify Telegram / WhatsApp after publication, with a link. Delivery retries should not repeat research.</tspan></text><polyline points="205,210 205,295" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="280" font-size="14" fill="#626b5d"><tspan x="220" dy="0">HTTP :8097</tspan></text><polyline points="360,390 450,390" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="365" y="379" font-size="14" fill="#626b5d"><tspan x="365" dy="0">read/write</tspan></text><polyline points="765,390 880,390" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="778" y="379" font-size="14" fill="#626b5d"><tspan x="778" dy="0">poll + status</tspan></text><polyline points="1060,485 1060,560" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1075" y="529" font-size="14" fill="#626b5d"><tspan x="1075" dy="0">Hermes CLI</tspan></text><polyline points="885,655 770,655" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="779" y="644" font-size="14" fill="#626b5d"><tspan x="779" dy="0">reads / runs</tspan></text><polyline points="610,770 610,850" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="625" y="819" font-size="14" fill="#626b5d"><tspan x="625" dy="0">archive + recent coverage</tspan></text><polyline points="1060,770 1060,860" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1075" y="833" font-size="14" fill="#626b5d"><tspan x="1075" dy="0">provider + web calls</tspan></text><polyline points="455,930 405,930 405,550 205,550 205,535" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285" y="911" font-size="14" fill="#626b5d"><tspan x="285" dy="0">read editions</tspan></text><polyline points="610,520 610,585" fill="none" stroke="#66745c" stroke-width="1.8" marker-end="url(#arrow)"/><text x="624" y="561" font-size="14" fill="#626b5d"><tspan x="624" dy="0">profile</tspan></text><text x="50" y="1206" font-size="16" fill="#626b5d"><tspan x="50" dy="0">Boundaries: journal mounts only data/research; Hermes mounts all data plus the read-only research kit.</tspan><tspan x="50" dy="21.6">Neither container mounts the Docker socket. The research agent CAN access its own credentials and the settings key.</tspan><tspan x="50" dy="21.6">Private-network, single-user deployment today — not yet hardened as a public multi-user service.</tspan></text></g></svg>
